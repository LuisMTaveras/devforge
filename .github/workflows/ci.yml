name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devforge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false # pnpm aún no existe aquí: lo activa corepack en el paso siguiente
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
